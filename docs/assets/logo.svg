<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Loss distribution with its left tail shaded and capped by a budget line">
  <defs>
    <clipPath id="tail"><rect x="20" y="20" width="66" height="190"/></clipPath>
  </defs>
  <rect x="8" y="8" width="224" height="224" rx="44" fill="#16324f"/>
  <!-- return density -->
  <path id="d" d="M24 180 C 42 176, 60 162, 76 140 C 96 112, 110 56, 138 56 C 162 56, 170 140, 188 162 C 200 176, 208 181, 218 182 Z" fill="#4a8fd0" opacity="0.35"/>
  <!-- shaded worst tail -->
  <path d="M24 180 C 42 176, 60 162, 76 140 C 96 112, 110 56, 138 56 C 162 56, 170 140, 188 162 C 200 176, 208 181, 218 182 Z" fill="#e0675f" clip-path="url(#tail)"/>
  <path d="M24 180 C 42 176, 60 162, 76 140 C 96 112, 110 56, 138 56 C 162 56, 170 140, 188 162 C 200 176, 208 181, 218 182" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- CVaR budget -->
  <line x1="86" y1="44" x2="86" y2="198" stroke="#ffffff" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/>
  <line x1="24" y1="198" x2="218" y2="198" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
</svg>
