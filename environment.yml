# Reproducible environment for cvar-rl-portfolio-allocator.
#   conda env create -f environment.yml && conda activate crlpa
# (mirrors the CI install; Python 3.11 is the tested version)
name: crlpa
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
      - -e .[dev]
