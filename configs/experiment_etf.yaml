# Real ETF-proxy universe pulled from the Yahoo chart API (adjusted close).
# Canonical seven-ETF paper universe. The committed parquet panel makes reruns
# offline; set data.source to yahoo only when intentionally refreshing prices.

experiment_id: cvar_ac_etf_v1
dataset_version: yahoo_etf7_2008_2024
seed: 42

data:
  source: parquet          # frozen via: scripts/build_dataset.py --config <this> --out <parquet_path>; set to yahoo to refetch
  tickers: [SPY, TLT, HYG, DBC, GLD, UUP, BIL]   # equity, rates, credit, commodity, gold, fx, cash
  start: "2008-01-01"
  end: "2024-12-31"
  weekly_rule: W-FRI
  parquet_path: data/processed/aligned_portfolio_panel_etf.parquet
  periods_per_year: 52
  train_frac: 0.6
  val_frac: 0.2

universe:
  universe_id: etf7
  assets: [SPY, TLT, HYG, DBC, GLD, UUP, BIL]

environment:
  transaction_cost_bps: 5.0     # ETF spreads + commission proxy
  lookback: 26

constraints:
  long_only: true
  max_weight: 0.40
  turnover_cap: 0.50
  gross_cap: 1.0
  cash_index: 6                 # BIL is the last (cash) asset
  cash_floor: 0.0

risk:
  cvar_alpha: 0.95
  cvar_limit: 0.03
  cvar_window: 52

model:
  hidden: [64, 64]
  actor_lr: 0.0003
  critic_lr: 0.001
  gamma: 0.95
  entropy_coef: 0.01
  value_coef: 0.5
  log_std_init: -0.5
  cost_mode: breach        # breach (0/1 indicator) | magnitude
  lagrange_lr: 1.0
  cvar_budget: 0.05         # tolerated weekly CVaR breach rate

training:
  n_episodes: 150
  turnover_penalty: 0.0
  entropy_decay: 0.1
  eval_every: 10
  seeds: [7, 13, 23, 42, 2025]

backtest:
  periods_per_year: 52
  bootstrap_resamples: 2000
  block_size: 4
